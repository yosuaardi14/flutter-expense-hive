name: Flutter CI

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
      version_name:
        description: "Version Name"
        required: true
        default: "1.2.0"
      version_number:
        description: "Version Number"
        required: true
        default: "5"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set build type
        run: echo "BUILD_TYPE=${{ github.event.inputs.build_type }}" >> $GITHUB_ENV

      - name: Set version name
        run: echo "VERSION_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_ENV

      - name: Set version number
        run: echo "VERSION_NUMBER=${{ github.event.inputs.version_number }}" >> $GITHUB_ENV
        
      - name: Build WEB
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'release'}}
        run: flutter build web --$BUILD_TYPE --build-name=$VERSION_NAME --build-number=$VERSION_NUMBER
        
      - name: Build APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'release'}}
        run: flutter build apk --$BUILD_TYPE --build-name=$VERSION_NAME --build-number=$VERSION_NUMBER
      
      - name: Upload Web
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'release'}}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
      
      - name: Upload APK Release
        if: ${{ github.event.inputs.build_type == 'release'}}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload APK Debug
        if: ${{ github.event.inputs.build_type == 'debug'}}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
